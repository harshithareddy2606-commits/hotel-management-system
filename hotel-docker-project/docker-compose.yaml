
services:

  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: hoteladmin
      MYSQL_PASSWORD: Hotel123
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    container_name: hotel-backend
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: hotel-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
